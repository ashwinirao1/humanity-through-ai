name: Daily Humanity Reflection

on:
  schedule:
    # Always run at midnight Pacific Time across DST
    # PDT (UTC-7): 07:00 UTC == 00:00 PDT
    # PST (UTC-8): 08:00 UTC == 00:00 PST
    - cron: "0 8 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch:

# Avoid overlapping runs if multiple triggers fire
concurrency:
  group: daily-humanity-reflection
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine if midnight in America/Los_Angeles
        id: timecheck
        run: |
          echo "Now (PT): $(TZ=America/Los_Angeles date)"
          HOUR=$(TZ=America/Los_Angeles date +%H)
          if [ "$HOUR" = "00" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.timecheck.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        if: steps.timecheck.outputs.should_run == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/archive_previous_day.py
          python scripts/fetch_news.py
          python scripts/curator_note.py
          python scripts/generate_art.py
          python scripts/build_site.py
          python scripts/update_sitemap.py

      - name: Commit changes
        if: steps.timecheck.outputs.should_run == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Daily update: $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No changes to commit"
          fi

