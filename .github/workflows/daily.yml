name: Daily Humanity Reflection

on:
  schedule:
    # Run at midnight Pacific Time (8:00 AM UTC)
    # Pacific Time accounts for both PST (UTC-8) and PDT (UTC-7)
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python scripts/fetch_news.py
          python scripts/curator_note.py
          python scripts/generate_art.py
          python scripts/build_site.py
          python scripts/update_sitemap.py

      - name: Commit changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add .
          git diff --cached --quiet || git commit -m "Daily update"
          git push


