<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Humanity Through AI</title>
  <style>
    :root{--max:960px;--accent:#111827;--muted:#6b7280}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial}
    body{display:flex;align-items:flex-start;justify-content:center;background:#f8fafc;color:var(--accent);}
    .wrap{max-width:var(--max);width:100%;padding:28px}

    header{display:flex;align-items:center;gap:18px;margin-bottom:18px}
    h1{font-size:34px;margin:0;letter-spacing:-0.02em}
    .subtitle{color:var(--muted);font-size:14px}

    main{display:grid;grid-template-columns:1fr 340px;gap:28px}
    .hero{background:#fff;padding:22px;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
    .art{width:100%;max-height:520px;border-radius:12px;object-fit:cover;background:linear-gradient(180deg,#111827,#374151);display:block}

    .headline{font-size:20px;margin:12px 0 0 0;font-weight:600}
    .date{color:var(--muted);font-size:13px;margin-top:6px}

    .topics{margin-top:18px;display:grid;grid-template-columns:1fr;gap:12px}
    .read{background:#f8fafc;padding:16px;border-radius:12px;border:1px solid #e2e8f0;transition:all 0.2s}
    .read:hover{background:#f1f5f9;border-color:#cbd5e1}
    .read .label{font-weight:600;color:var(--accent);margin-bottom:8px;font-size:14px}
    .read a{color:var(--accent);text-decoration:none;font-weight:500;transition:color 0.2s}
    .read a:hover{color:#3b82f6}
    .read .source{color:var(--muted);font-size:12px;margin-left:8px}
    .read ul{margin:8px 0 0 0;padding-left:16px}
    .read li{margin:4px 0;font-size:14px}

    aside{position:relative}
    .meta-card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 6px 18px rgba(15,23,42,0.06)}
    .archive{margin-top:16px}
    .archive a{color:#3b82f6;text-decoration:none;font-size:13px;margin-right:8px;padding:4px 8px;background:#f1f5f9;border-radius:6px;transition:all 0.2s}
    .archive a:hover{background:#e2e8f0;color:#1d4ed8}
    .archive div{margin:8px 0}
    .archive strong{color:var(--accent);font-size:14px}

    footer{margin-top:22px;color:var(--muted);font-size:13px}

    @media (max-width:900px){
      main{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Humanity Through AI</h1>
        <div class="subtitle">A daily reflection of how humanity feels — art, headline, and curated reading.</div>
      </div>
    </header>

    <main>
      <section class="hero">
        <img id="art" class="art" alt="Daily artwork" />
        <div class="headline" id="headline">Loading…</div>
        <div class="date" id="date"></div>

        <div class="topics">
          <div class="read"><div class="label">Health</div><div id="health"></div></div>
          <div class="read"><div class="label">Politics</div><div id="politics"></div></div>
          <div class="read"><div class="label">Entertainment</div><div id="entertainment"></div></div>
        </div>
      </section>

      <aside>
        <div class="meta-card">
          <strong>Archive</strong>
          <div class="archive" id="archive"></div>
        </div>
      </aside>
    </main>

    <footer>
      © <span id="year"></span> Humanity Through AI
    </footer>
  </div>

  <script>
    function svgPlaceholder() {
      const svg = `<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="40%" stop-color="#0b3b3b"/><stop offset="100%" stop-color="#7c2d12"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g1)"/><g fill-opacity="0.18"><circle cx="220" cy="420" r="260" fill="#ffb07c"/><circle cx="900" cy="200" r="300" fill="#2b5bff"/></g><g fill="#fff" opacity="0.06"><path d="M0,550 C300,450 500,650 1200,500 L1200,700 L0,700 Z"/></g><text x="50" y="80" fill="#fff" font-size="28" font-family="sans-serif" opacity="0.9">How Humanity Felt — Sample</text></svg>`;
      return 'data:image/svg+xml;base64,' + btoa(svg);
    }

    async function loadManifest() {
      try {
        const res = await fetch('./site/manifest.json', {cache: 'no-store'});
        if (!res.ok) throw new Error('manifest not found');
        return await res.json();
      } catch (e) {
        return { entries: [] };
      }
    }

    function render(manifest) {
      const latest = manifest.entries && manifest.entries.length ? manifest.entries[0] : null;
      const art = document.getElementById('art');
      const headline = document.getElementById('headline');
      const date = document.getElementById('date');
      const archive = document.getElementById('archive');
      const year = document.getElementById('year');
      year.textContent = new Date().getFullYear();

      if (!latest) {
        art.src = svgPlaceholder();
        headline.textContent = 'A day of fragile hope amidst voices rising';
        date.textContent = new Date().toISOString().slice(0,10);
        document.getElementById('health').innerHTML = '<em>No data yet</em>';
        document.getElementById('politics').innerHTML = '<em>No data yet</em>';
        document.getElementById('entertainment').innerHTML = '<em>No data yet</em>';
        archive.innerHTML = '<em>Archive will appear after the first run.</em>';
        return;
      }

      art.src = latest.image ? `./site/${latest.image}` : svgPlaceholder();
      art.alt = latest.title || 'Daily artwork';
      headline.textContent = latest.title || '';
      date.textContent = latest.date || '';

      function linksHtml(section){
        if (!section || !section.links || !section.links.length) return '<em>No links</em>';
        return '<ul>' + section.links.map(l => `<li><a href="${l.url}" target="_blank" rel="noopener">${l.title}</a> <span class="source">${l.source||''}</span></li>`).join('') + '</ul>';
      }

      document.getElementById('health').innerHTML = (latest.topics && latest.topics.health ? `<div>${latest.topics.health.summary||''}</div>` + linksHtml(latest.topics.health) : '<em>No data</em>');
      document.getElementById('politics').innerHTML = (latest.topics && latest.topics.politics ? `<div>${latest.topics.politics.summary||''}</div>` + linksHtml(latest.topics.politics) : '<em>No data</em>');
      document.getElementById('entertainment').innerHTML = (latest.topics && latest.topics.entertainment ? `<div>${latest.topics.entertainment.summary||''}</div>` + linksHtml(latest.topics.entertainment) : '<em>No data</em>');

      const byYear = {};
      for (const e of manifest.entries) {
        const y = (e.date||'').slice(0,4);
        const m = (e.date||'').slice(5,7);
        (byYear[y] ||= {});
        (byYear[y][m] ||= []).push(e);
      }
      const years = Object.keys(byYear).sort((a,b)=>b.localeCompare(a));
      archive.innerHTML = years.map(y => {
        const months = Object.keys(byYear[y]).sort((a,b)=>b.localeCompare(a));
        const monthHtml = months.map(m => {
          const days = byYear[y][m].map(d => `<a href="site/entries/${d.date}.md" target="_blank" rel="noopener">${d.date.slice(8,10)}</a>`).join(' ');
          return `<div><strong>${y}-${m}</strong> — ${days}</div>`;
        }).join('');
        return `<div>${monthHtml}</div>`;
      }).join('');
    }

    loadManifest().then(render);
  </script>
</body>
</html>
